services:
  influxdb:
    container_name: influxdb
    image: influxdb:2.8.0
    volumes:
      - influxdb-storage:/var/lib/influxdb2:rw
      - ./script.sh:/docker-entrypoint-initdb.d/script.sh:rwx
    env_file:
      - .env
    restart: always
    ports:
      - ${DOCKER_INFLUXDB_INIT_PORT}:8086

  telegraf:
    container_name: telegraf
    image: telegraf:1.27.4
    volumes:
      - ${TELEGRAF_CFG_PATH}:/etc/telegraf/telegraf.conf:rw
      - ${TELEGRAF_METRICS_PATH}:/tmp/metrics.out:rw
    restart: on-failure:10
    env_file:
      - .env
    depends_on:
      - influxdb
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:10.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${DOCKER_INFLUXDB_INIT_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
    volumes:
      - grafana-storage:/var/lib/grafana:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard_grafana.json:/var/lib/grafana/dashboards/dashboard_grafana.json:ro
    depends_on:
      - influxdb
    env_file:
      - .env
    ports:
      - ${GRAFANA_PORT}:3000
    restart: on-failure:10

  ngrok: # for production use CLOUDFLARE instead (it is only necessary to adquire a domain e.g:vetorial.xyz)
    container_name: ngrok
    image: ngrok/ngrok:3
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
      - "--authtoken"
      - "${NGROK_AUTHTOKEN}"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - 4040:4040
    env_file:
      - .env
    depends_on:
      - influxdb
    restart: on-failure:10

volumes:
  grafana-storage:
  influxdb-storage: